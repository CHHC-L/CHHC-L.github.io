name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: withastro/action@v6

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # Tell Bing and the other IndexNow engines (indexnow.org) what's on the site.
  # The key is public by design; its file is public/<key>.txt.
  indexnow:
    needs: deploy
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      SITE: https://chhc-l.github.io
      KEY: e8c13572f099ba3daec3a71039abb31e
    steps:
      - name: Submit sitemap URLs
        run: |
          urls=$(curl -fsS "$SITE/sitemap-0.xml" | grep -o '<loc>[^<]*' | sed 's/<loc>//' | jq -R . | jq -sc .)
          body=$(jq -nc --arg host "${SITE#https://}" --arg key "$KEY" --arg loc "$SITE/$KEY.txt" \
            --argjson urls "$urls" '{host: $host, key: $key, keyLocation: $loc, urlList: $urls}')
          status=$(curl -sS -o response.txt -w '%{http_code}' -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json; charset=utf-8' -d "$body")
          echo "IndexNow: HTTP $status for $(echo "$urls" | jq length) URLs"; cat response.txt
          # 200 = accepted, 202 = accepted while the key is being checked
          [ "$status" = 200 ] || [ "$status" = 202 ]
